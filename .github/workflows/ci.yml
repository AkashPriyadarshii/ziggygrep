name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-latest
            target: aarch64-macos

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Unit tests
        shell: bash
        run: |
          for f in Args Search Simd; do
            zig test src/$f.zig
          done

      - name: Smoke tests
        shell: bash
        run: |
          BIN=zig-out/bin/ziggygrep
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=$BIN.exe; fi
          $BIN --help
          $BIN -V
          printf 'foo one\ntwo\nfoo two\n' | $BIN foo
          $BIN -c foo src/Args.zig
          $BIN -l fn src/
          $BIN ZZZNOMATCHXYZ src/ && exit 1 || true

      - name: Rename binary
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd zig-out/bin
          if [ -f ziggygrep.exe ]; then
            mv ziggygrep.exe "ziggygrep-${{ matrix.target }}.exe"
          else
            mv ziggygrep "ziggygrep-${{ matrix.target }}"
          fi
          ls -la ziggygrep-${{ matrix.target }}*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ziggygrep-${{ matrix.target }}
          path: zig-out/bin/ziggygrep-${{ matrix.target }}*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Check if release already exists
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ziggygrep-*/ziggygrep-*

      - name: Attach assets only (release already exists)
        if: steps.rel.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/ziggygrep-*/ziggygrep-*; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
