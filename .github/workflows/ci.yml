name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
          - os: ubuntu-latest
            target: x86_64-linux

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Unit tests
        shell: bash
        run: |
          for f in Args Search Simd; do
            zig test src/$f.zig
          done

      - name: Smoke tests
        shell: bash
        run: |
          BIN=zig-out/bin/ziggygrep
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=$BIN.exe; fi
          $BIN --help
          $BIN -V
          printf 'foo one\ntwo\nfoo two\n' | $BIN foo
          $BIN -c foo src/Args.zig
          $BIN -l fn src/
          $BIN ZZZNOMATCHXYZ src/ && exit 1 || true
