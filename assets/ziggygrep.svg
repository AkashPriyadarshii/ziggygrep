<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="ziggygrep logo: magnifier over Z">
  <rect width="96" height="96" rx="20" fill="#0f1114"/>
  <!-- magnifier ring -->
  <circle cx="42" cy="42" r="22" fill="none" stroke="#f7a41d" stroke-width="7"/>
  <!-- Z cut inside lens -->
  <path d="M32 34 h20 l-20 16 h20" stroke="#e8590c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- handle -->
  <line x1="58" y1="58" x2="76" y2="76" stroke="#ece8e2" stroke-width="7" stroke-linecap="round"/>
  <!-- match ticks -->
  <line x1="42" y1="14" x2="42" y2="20" stroke="#f7a41d" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="42" x2="76" y2="42" stroke="#f7a41d" stroke-width="3" stroke-linecap="round"/>
</svg>
